name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recoverchain_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy (typed core)
        run: mypy domain application/policy_engine.py application/case_pipeline.py || true

      - name: Alembic round-trip on Postgres
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/recoverchain_test
        run: |
          export PYTHONPATH=.
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Alembic upgrade on SQLite
        run: |
          export PYTHONPATH=.
          DATABASE_URL=sqlite:///./_ci.db alembic upgrade head

      - name: Pytest + coverage
        run: |
          export PYTHONPATH=.
          pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Dependency audit (advisory)
        run: pip-audit -r requirements.txt || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier check
        run: npm run format:check
      - name: Typecheck + build
        run: npm run build
      - name: npm audit (advisory)
        run: npm audit --omit=dev || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t recoverchain-api ./backend
      - name: Build frontend image
        run: docker build -t recoverchain-web ./frontend
